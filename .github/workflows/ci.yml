name: CI

on:
  push:

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Instalar Ruff
      run: python3 -m pip install ruff
    - name: Validar qualidade com Ruff
      working-directory: python
      run: ruff check .

    - name: Validar sintaxe Python
      working-directory: python
      run: python3 -m compileall .
    - name: Instalar ferramentas de teste
      run: python3 -m pip install pytest coverage

    - name: Executar testes com cobertura
      working-directory: python
      run: python3 -m coverage run --source=app -m pytest -v

    - name: Validar cobertura minima
      working-directory: python
      run: python3 -m coverage report -m --fail-under=90


    - name: Testar ambiente
      run: echo "Github Actions funcionando" 
    - name: Build Docker
      working-directory: python
      run: docker build -t github-laboratorio-python .

    - name: Run Docker
      run: docker run --rm github-laboratorio-python
        

      
